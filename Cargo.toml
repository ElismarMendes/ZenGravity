[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocol",
    "crates/central",
    "crates/agent",
    "crates/simulator",
    "crates/desktop",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Proprietary"

[workspace.dependencies]
zengravity-core = { path = "crates/core", features = ["serde"] }
zengravity-protocol = { path = "crates/protocol" }
zengravity-central = { path = "crates/central" }
zengravity-agent = { path = "crates/agent" }
zengravity-simulator = { path = "crates/simulator" }
zengravity-test-support = { path = "crates/test-support" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.31"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 2
